<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#171717; --line:#222222; --line-2:#2f2f2f;
  --text:#f5f5f5; --muted:#8f8f8f; --faint:#565656;
  --radius:12px; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{background:var(--bg)}
body{color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--text);color:var(--bg)}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{font-weight:700;letter-spacing:-.02em;font-size:18px;padding:0 10px;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;background:var(--text);border-radius:2px;display:inline-block}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);padding:0 10px 6px}
.nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.nav a:hover{color:var(--text);background:var(--surface)}
.nav a.on{color:var(--bg);background:var(--text);font-weight:500}
.side .spacer{flex:1}
.nav{display:flex;flex-direction:column;gap:22px}
.menu-btn{display:none;align-items:center;gap:10px;background:transparent;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px 7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.menu-btn svg{width:18px;height:18px}
main{padding:40px 48px 80px;max-width:1180px;width:100%;min-width:0}
.main[data-act]{cursor:pointer}
.main[data-act]:hover .t{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.sub-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tx-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* headings */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.head p{color:var(--muted);margin-top:6px}
.head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 a{text-transform:none;letter-spacing:0;color:var(--faint);font-size:13px}
h2 a:hover{color:var(--text)}

/* cards & grid */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
.stat b{font:500 clamp(17px,1.7vw,22px)/1.2 var(--mono);white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.inv{background:var(--text);color:var(--bg);border-color:var(--text)}
.stat.inv span{color:#555}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.empty{color:var(--faint);padding:18px 0;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{background:#d9d9d9}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger:hover{border-color:var(--text);background:var(--text);color:var(--bg)}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--faint);flex:none}
.ib:hover{color:var(--text);background:var(--surface-2)}
.ib svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* tabs */
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--text);color:var(--bg);font-weight:500}

/* inputs */
input,select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;outline:none;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--text)}
textarea{resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--faint)}
.inline{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.inline > *{flex:1 1 140px}
.inline .grow{flex:3 1 240px}
.inline .btn{flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row.wrap{flex-wrap:wrap}
.row.wrap .main{flex:1 1 160px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--muted);margin-top:1px}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.row .end{display:flex;align-items:center;gap:4px;flex:none}
.card .list .row:first-child{padding-top:0}

.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--faint);border-radius:5px;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;background:transparent;transition:all .15s}
.check:hover{border-color:var(--text)}
.check:checked{background:var(--text);border-color:var(--text)}
.check:checked::after{content:'';width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}

.tag{font-size:11px;border:1px solid var(--line-2);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tag.solid{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.tag.dash{border-style:dashed}
.prio{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--text)}
.prio.alta{background:var(--text)}
.prio.media{background:linear-gradient(90deg,var(--text) 50%,transparent 50%)}
.prio.baixa{border-color:var(--faint)}

/* bars */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--text);border-radius:99px;transition:width .3s}
.bar.over i{background:repeating-linear-gradient(-45deg,var(--text) 0 6px,#6b6b6b 6px 12px)}
.bar.lg{height:10px}

/* habits */
.hab-grid{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,36px) 64px 64px;align-items:center;gap:6px 6px}
.hab-grid .hd{font-size:11px;color:var(--faint);text-align:center;text-transform:uppercase}
.hab-grid .hd.today{color:var(--text)}
.day{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:transparent;cursor:pointer;justify-self:center;transition:all .15s}
.day:hover{border-color:var(--muted)}
.day.on{background:var(--text);border-color:var(--text)}
.hab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{font:500 13px var(--mono);text-align:right}
.hab-sep{grid-column:1/-1;border-bottom:1px solid var(--line);margin:4px 0}
.pill-toggle{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;background:transparent;width:100%;text-align:left;transition:all .15s}
.pill-toggle:hover{border-color:var(--muted)}
.pill-toggle.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill-toggle .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.pill-toggle.on .dot{background:var(--bg);border-color:var(--bg)}
.pills{display:grid;gap:8px}

/* notes */
.notes{columns:3 260px;column-gap:16px}
.note{break-inside:avoid;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 10px;cursor:pointer;transition:border-color .15s}
.note:hover{border-color:var(--line-2)}
.note.pinned{border-color:var(--muted)}
.note p{white-space:pre-wrap;word-wrap:break-word}
.note footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--faint)}

/* goals & boxes */
.gcard{display:flex;flex-direction:column;gap:14px}
.gcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.gcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font:500 26px/1 var(--mono);letter-spacing:-.03em}

/* table-ish */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);text-align:left;padding:0 10px 10px}
.tbl td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}

.month{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:9px;padding:3px}
.month span{min-width:150px;text-align:center;font-weight:500;font-size:13px}

.cat-row{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:12px;align-items:center;padding:7px 0}
.date-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:18px 0 4px}
.date-h:first-child{padding-top:0}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in::before{content:'+ '}
.amt.out{color:var(--muted)}
.amt.out::before{content:'− '}

/* dialog */
dialog{margin:auto;background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:16px;padding:0;width:min(460px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:16px}
dialog h3{font-size:18px;font-weight:600;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:12px;color:var(--muted)}
.fields{display:flex;flex-direction:column;gap:14px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.dlg-actions .left{margin-right:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.settings{max-width:560px;display:flex;flex-direction:column;gap:16px}
.settings .card p{color:var(--muted);font-size:13px;margin:4px 0 14px}

/* responsive */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .tx-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  /* barra superior + menu */
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:0 16px;height:56px;gap:12px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);overflow:visible}
  .side .spacer{display:none}
  .brand{padding:0}
  .menu-btn{display:inline-flex}
  .nav{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;background:var(--bg);padding:20px 16px 40px;overflow-y:auto;grid-template-columns:1fr 1fr;gap:24px 12px;align-content:start}
  body.menu-open .nav{display:grid}
  body.menu-open{overflow:hidden}
  .nav-group:first-child,.nav-group:last-child{grid-column:1/-1}
  .nav a{padding:10px 12px;font-size:15px}

  main{padding:24px 16px 64px}
  .head{margin-bottom:20px;align-items:flex-start}
  .head h1{font-size:24px}
  .head .actions{width:100%}
  .head .actions .btn.primary{margin-left:auto}
  .card{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .stats,.stats.s3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stats .stat:first-child{grid-column:1/-1}
  .stats:not(.s3) .stat:first-child{grid-column:auto}
  .stat{padding:14px}
  .stat b{font-size:16px}
  .stat span{font-size:11px}

  /* formulários em linha viram grade de 2 colunas */
  .inline{display:grid;grid-template-columns:1fr 1fr}
  .inline .grow,.inline .btn,.inline > :only-child{grid-column:1/-1}
  .inline .btn{justify-content:center;padding:10px}
  .inline > *{min-width:0}

  /* linhas: tocar no texto abre a edição; ícones somem */
  .row .end{display:none}
  .row.job{flex-wrap:wrap}
  .row.job .main{flex:1 1 100%}
  .row.job .amt{margin-right:auto}
  .row .amt{font-size:13px}
  .bill-day{display:none}

  /* hábitos: nome em cima, dias embaixo */
  .hab-grid{grid-template-columns:repeat(7,minmax(0,1fr)) 40px 28px;gap:6px 4px}
  .hab-grid > .hd-blank{display:none}
  .hab-name{grid-column:1/-1;margin-top:8px;font-weight:500}
  .hab-grid .day{width:100%;max-width:36px;height:auto;aspect-ratio:1}

  /* clientes: tabela vira cartões */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl-wrap{overflow:visible}
  .tbl .num{font-size:13px}
  .tbl tr{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px 8px;padding:14px 0;border-top:1px solid var(--line)}
  .tbl tr:first-child{border-top:0;padding-top:0}
  .tbl td{border:0;padding:0;text-align:left !important}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font:500 10px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:2px}
  .tbl td.full{grid-column:1/-1}
  .tbl td.acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-start}
  .tbl td.acts .ib{display:inline-grid}

  .month{flex:1;justify-content:space-between}
  .month span{min-width:0}
  .notes{columns:1}
  .gcard .foot{flex-wrap:wrap}
  .cat-row{grid-template-columns:minmax(70px,100px) 1fr auto;gap:8px}
  .tabs{flex:1}
  .tabs button{flex:1;padding:6px 8px}
  .dlg-actions{flex-wrap:wrap}
  .dlg-actions .btn{flex:1;justify-content:center}
  .dlg-actions .left{flex-basis:100%;order:3;margin:0}
}
/* evita o zoom automático do celular ao focar campos (navegadores dão zoom em fontes < 16px) */
@media (max-width:820px), (pointer:coarse){
  input,select,textarea{font-size:16px}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  dialog{max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain}
}
@media (max-width:360px){
  .stats,.stats.s3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i>Painel</div>
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false"><span id="menuLabel"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form id="dlgForm" novalidate>
    <h3 id="dlgTitle"></h3>
    <div class="fields" id="dlgFields"></div>
    <div class="dlg-actions">
      <button type="button" class="btn danger left" id="dlgDelete">Excluir</button>
      <button type="button" class="btn" id="dlgCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="dlgSave">Salvar</button>
    </div>
  </form>
</dialog>
<datalist id="cats"></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const shiftMonth = (m, n) => { const d = parse(m+'-01'); d.setMonth(d.getMonth()+n); return iso(d).slice(0,7); };
const daysInMonth = m => { const d = parse(m+'-01'); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); };
const brl = n => (+n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtD = s => s ? parse(s).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.', '') : '';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = m => cap(parse(m+'-01').toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').trim().toLowerCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);

const I = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3H6l4-3z"/><path d="M12 13v7"/></svg>',
  pinOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3H6l4-3z"/><path d="M12 13v7" fill="none"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};

/* ---------- armazenamento ---------- */
const KEY = 'painel.v1';
const defaults = () => ({ name:'', tasks:[], habits:[], goals:[], notes:[], clients:[], jobs:[], tx:[], budgets:{}, bills:[], boxes:[] });
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  return defaults();
}
let S = load();
function save(msg) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Não foi possível salvar no navegador'); }
  render();
  if (msg) toast(msg);
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000); }

/* ---------- estado de interface ---------- */
const UI = { taskFilter:'hoje', jobFilter:'pendentes', month: today().slice(0,7) };
const OUT_CATS = ['Moradia','Mercado','Alimentação','Transporte','Saúde','Lazer','Assinaturas','Equipamento','Educação','Outros'];
const IN_CATS = ['Edição de vídeo','Salário','Outros'];
const GOAL_AREAS = ['Pessoal','Trabalho','Finanças','Saúde','Estudos','Outro'];

/* ---------- formulário em diálogo ---------- */
let dlgCtx = null;
function fieldHTML(f, v) {
  v = v ?? f.value ?? '';
  const a = `id="f_${f.name}" name="${f.name}" ${f.required ? 'required' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}`;
  let input;
  if (f.type === 'textarea') input = `<textarea ${a} rows="${f.rows || 6}">${esc(v)}</textarea>`;
  else if (f.type === 'select') input = `<select ${a}>${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  else input = `<input ${a} type="${f.type || 'text'}" value="${esc(v)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} ${f.list ? `list="${f.list}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  return `<label class="field"><span>${esc(f.label)}</span>${input}</label>`;
}
function openForm({ title, fields, values = {}, onSave, onDelete, saveLabel = 'Salvar' }) {
  $('#dlgTitle').textContent = title;
  $('#dlgFields').innerHTML = fields.map(f => fieldHTML(f, values[f.name])).join('');
  $('#dlgDelete').hidden = !onDelete;
  $('#dlgSave').textContent = saveLabel;
  dlgCtx = { fields, onSave, onDelete };
  $('#dlg').showModal();
  // no celular não foca automaticamente, para o teclado não abrir sozinho ao abrir o pop-up
  const first = $('#dlgFields').querySelector('input,textarea,select');
  if (first && matchMedia('(pointer:fine)').matches) first.focus();
}
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlgDelete').onclick = () => { if (dlgCtx?.onDelete && dlgCtx.onDelete() !== false) { $('#dlg').close(); save('Excluído'); } };
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, data = {};
  for (const f of dlgCtx.fields) {
    const el = form.elements[f.name];
    let v = el.value;
    if (f.type === 'number') v = parseFloat(String(v).replace(',', '.')) || 0;
    if (f.required && (v === '' || v == null)) { el.focus(); toast(`Preencha: ${f.label}`); return; }
    data[f.name] = typeof v === 'string' ? v.trim() : v;
  }
  if (dlgCtx.onSave(data) === false) return;
  $('#dlg').close();
  save('Salvo');
});

/* ---------- cálculos ---------- */
const txOfMonth = m => S.tx.filter(t => t.date && t.date.startsWith(m));
function monthTotals(m) {
  const list = txOfMonth(m);
  const inc = sum(list.filter(t => t.type === 'in'), t => t.amount);
  const out = sum(list.filter(t => t.type === 'out'), t => t.amount);
  return { inc, out, bal: inc - out };
}
function streak(h) {
  let d = today(), n = 0;
  if (!h.log[d]) d = addDays(d, -1);
  while (h.log[d]) { n++; d = addDays(d, -1); }
  return n;
}
const clientName = id => S.clients.find(c => c.id === id)?.name || '';
function dueLabel(due) {
  if (!due) return '';
  const t = today();
  if (due < t) return 'Atrasada · ' + fmtD(due);
  if (due === t) return 'Hoje';
  if (due === addDays(t, 1)) return 'Amanhã';
  return fmtD(due);
}
function billStatus(b, m) {
  if (b.paid?.[m]) return { label:'Pago', cls:'solid', paid:true };
  const cur = today().slice(0,7), d = new Date().getDate();
  if (m < cur || (m === cur && b.dueDay < d)) return { label:'Atrasada', cls:'' , late:true };
  if (m === cur && b.dueDay - d <= 5) return { label: b.dueDay === d ? 'Vence hoje' : `Vence em ${b.dueDay - d}d`, cls:'' };
  return { label:`Dia ${b.dueDay}`, cls:'dash' };
}
function syncCats() {
  const set = new Set([...OUT_CATS, ...IN_CATS, ...Object.keys(S.budgets), ...S.tx.map(t => t.category).filter(Boolean)]);
  $('#cats').innerHTML = [...set].map(c => `<option value="${esc(c)}">`).join('');
}

/* ---------- componentes ---------- */
const head = (title, sub, actions = '') => `<div class="head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="actions">${actions}</div></div>`;
const monthNav = () => `<div class="month"><button class="ib" data-act="month" data-step="-1" aria-label="Mês anterior">${I.l}</button><span>${monthLabel(UI.month)}</span><button class="ib" data-act="month" data-step="1" aria-label="Próximo mês">${I.r}</button></div>`;
const tabs = (act, cur, opts) => `<div class="tabs">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const bar = (pct, over, lg) => `<div class="bar ${over ? 'over' : ''} ${lg ? 'lg' : ''}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const empty = t => `<div class="empty">${t}</div>`;
const rowBtns = (kind, id) => `<button class="ib" data-act="${kind}-edit" data-id="${id}" aria-label="Editar">${I.edit}</button><button class="ib" data-act="${kind}-del" data-id="${id}" aria-label="Excluir">${I.x}</button>`;

function taskRow(x) {
  const due = dueLabel(x.due);
  return `<div class="row ${x.done ? 'done' : ''}">
    <input type="checkbox" class="check" data-act="task-toggle" data-id="${x.id}" ${x.done ? 'checked' : ''} aria-label="Concluir">
    <span class="prio ${x.prio || 'media'}" title="Prioridade ${x.prio || 'media'}"></span>
    <div class="main" data-act="task-edit" data-id="${x.id}"><div class="t">${esc(x.title)}</div>${due ? `<div class="sub">${due}</div>` : ''}</div>
    <div class="end">${rowBtns('task', x.id)}</div></div>`;
}
function jobRow(j) {
  const c = clientName(j.clientId);
  return `<div class="row job">
    <div class="main" data-act="job-edit" data-id="${j.id}"><div class="t">${esc(j.title)}</div><div class="sub">${[c && esc(c), j.date && fmtD(j.date), j.paid && j.paidDate ? 'pago em ' + fmtD(j.paidDate) : ''].filter(Boolean).join(' · ')}</div></div>
    <span class="amt">${brl(j.value)}</span>
    <button class="btn sm ${j.paid ? 'primary' : ''}" data-act="job-paid" data-id="${j.id}">${j.paid ? 'Pago' : 'Marcar pago'}</button>
    <div class="end">${rowBtns('job', j.id)}</div></div>`;
}
function billRow(b, m) {
  const s = billStatus(b, m);
  return `<div class="row">
    <span class="mono faint bill-day" style="width:24px;font-size:12px">${pad(b.dueDay)}</span>
    <div class="main" data-act="bill-edit" data-id="${b.id}"><div class="t">${esc(b.name)}</div><div class="sub sub-tags"><span class="tag ${s.cls}">${s.label}</span><span>${esc(b.category || 'Contas fixas')}</span></div></div>
    <span class="amt">${brl(b.amount)}</span>
    <button class="btn sm ${s.paid ? 'primary' : ''}" data-act="bill-paid" data-id="${b.id}" data-m="${m}">${s.paid ? 'Pago' : 'Pagar'}</button>
    <div class="end">${rowBtns('bill', b.id)}</div></div>`;
}
function txRow(t) {
  const link = t.jobId ? 'trabalho' : t.billId ? 'conta fixa' : '';
  return `<div class="row">
    <div class="main" data-act="tx-edit" data-id="${t.id}"><div class="t">${esc(t.desc || t.category)}</div><div class="sub">${esc(t.category || '')}${link ? ` · <span class="faint">${link}</span>` : ''}</div></div>
    <span class="amt ${t.type}">${brl(t.amount)}</span>
    <div class="end">${rowBtns('tx', t.id)}</div></div>`;
}

/* ---------- telas ---------- */
const V = {};

V.overview = () => {
  const t = today(), m = t.slice(0,7), h = new Date().getHours();
  const hi = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const { inc, out, bal } = monthTotals(m);
  const pending = S.jobs.filter(j => !j.paid);
  const receivable = sum(pending, j => j.value);
  const todayTasks = S.tasks.filter(x => !x.done && (!x.due || x.due <= t))
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')).slice(0, 7);
  const bills = S.bills.filter(b => !b.paid?.[m]).sort((a, b) => a.dueDay - b.dueDay).slice(0, 5);
  const goals = S.goals.filter(g => (+g.progress || 0) < 100).slice(0, 4);
  const date = cap(new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }));
  const habitsDone = S.habits.filter(x => x.log[t]).length;

  return head(`${hi}${S.name ? ', ' + esc(S.name) : ''}.`, date) + `
  <div class="stats">
    <div class="stat inv"><span>Saldo de ${parse(m+'-01').toLocaleDateString('pt-BR',{month:'long'})}</span><b>${brl(bal)}</b></div>
    <div class="stat"><span>Entradas</span><b>${brl(inc)}</b></div>
    <div class="stat"><span>Saídas</span><b>${brl(out)}</b></div>
    <div class="stat"><span>A receber · ${pending.length} job${pending.length === 1 ? '' : 's'}</span><b>${brl(receivable)}</b></div>
  </div>
  <div class="grid g2">
    <section class="card"><h2>Para hoje <a href="#tasks">ver tudo</a></h2>
      <form class="inline" data-form="task-quick" style="margin-bottom:12px"><input name="title" class="grow" placeholder="Nova tarefa para hoje…" autocomplete="off"></form>
      <div class="list">${todayTasks.map(taskRow).join('') || empty('Nada pendente para hoje.')}</div></section>
    <section class="card"><h2>Hábitos · ${habitsDone}/${S.habits.length} <a href="#habits">ver tudo</a></h2>
      <div class="pills">${S.habits.map(x => `<button class="pill-toggle ${x.log[t] ? 'on' : ''}" data-act="habit-toggle" data-id="${x.id}" data-day="${t}"><span class="dot"></span><span style="flex:1">${esc(x.name)}</span><span class="mono" style="font-size:12px;opacity:.7">${streak(x)}d</span></button>`).join('') || empty('Nenhum hábito ainda. <a href="#habits" style="text-decoration:underline">Criar</a>')}</div></section>
    <section class="card"><h2>Contas do mês <a href="#bills">ver tudo</a></h2>
      <div class="list">${bills.map(b => billRow(b, m)).join('') || empty(S.bills.length ? 'Todas as contas do mês estão pagas.' : 'Nenhuma conta fixa cadastrada.')}</div></section>
    <section class="card"><h2>A receber <a href="#jobs">ver tudo</a></h2>
      <div class="list">${pending.slice(0, 5).map(jobRow).join('') || empty('Nenhum pagamento pendente.')}</div></section>
  </div>
  ${goals.length ? `<section style="margin-top:16px"><div class="grid g2">${goals.map(g => `<div class="card gcard"><div class="top"><div><h3>${esc(g.title)}</h3><div class="meta"><span class="tag">${esc(g.area)}</span>${g.deadline ? `<span class="tag dash">até ${fmtD(g.deadline)}</span>` : ''}</div></div><span class="big">${+g.progress || 0}%</span></div>${bar(g.progress, false, true)}</div>`).join('')}</div></section>` : ''}`;
};

V.tasks = () => {
  const t = today(), week = addDays(t, 7), f = UI.taskFilter;
  let list = S.tasks;
  if (f === 'hoje') list = list.filter(x => !x.done && (!x.due || x.due <= t));
  if (f === 'semana') list = list.filter(x => !x.done && x.due && x.due <= week);
  if (f === 'todas') list = list.filter(x => !x.done);
  if (f === 'feitas') list = list.filter(x => x.done);
  const order = { alta:0, media:1, baixa:2 };
  list = [...list].sort((a, b) => f === 'feitas' ? (b.doneAt || '').localeCompare(a.doneAt || '') :
    (a.due || '9999').localeCompare(b.due || '9999') || order[a.prio || 'media'] - order[b.prio || 'media']);
  const open = S.tasks.filter(x => !x.done).length;
  return head('Tarefas', `${open} em aberto`, tabs('task-filter', f, [['hoje','Hoje'],['semana','7 dias'],['todas','Todas'],['feitas','Concluídas']])) + `
  <form class="inline" data-form="task">
    <input name="title" class="grow" placeholder="O que precisa ser feito?" autocomplete="off" required>
    <input name="due" type="date" value="${f === 'hoje' ? t : ''}" aria-label="Data">
    <select name="prio" aria-label="Prioridade"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select>
    <button class="btn primary">Adicionar</button>
  </form>
  <div class="card"><div class="list">${list.map(taskRow).join('') || empty(f === 'feitas' ? 'Nenhuma tarefa concluída.' : 'Tudo em dia.')}</div>
  ${f === 'feitas' && list.length ? `<div style="margin-top:14px"><button class="btn sm" data-act="task-clear">Limpar concluídas</button></div>` : ''}</div>`;
};

V.habits = () => {
  const t = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const wd = d => parse(d).toLocaleDateString('pt-BR', { weekday:'short' }).slice(0, 3).replace('.', '');
  return head('Hábitos', 'Os últimos 7 dias. Clique no quadrado para marcar.', `<button class="btn primary" data-act="habit-add">Novo hábito</button>`) + `
  <div class="card">${S.habits.length ? `<div class="hab-grid">
    <div class="hd-blank"></div>${days.map(d => `<div class="hd ${d === t ? 'today' : ''}">${wd(d)}<br><span class="mono">${parse(d).getDate()}</span></div>`).join('')}<div class="hd">Seq.</div><div></div>
    <div class="hab-sep"></div>
    ${S.habits.map(h => `<div class="hab-name">${esc(h.name)}</div>${days.map(d => `<button class="day ${h.log[d] ? 'on' : ''}" data-act="habit-toggle" data-id="${h.id}" data-day="${d}" aria-label="${esc(h.name)} ${d}"></button>`).join('')}<div class="streak">${streak(h)}d</div><div class="end" style="display:flex;justify-content:flex-end"><button class="ib" data-act="habit-edit" data-id="${h.id}" aria-label="Editar">${I.edit}</button></div>`).join('')}
  </div>` : empty('Crie hábitos como “Treinar”, “Ler 20 min” ou “Beber 2L de água”.')}</div>`;
};

V.goals = () => {
  const list = [...S.goals].sort((a, b) => (+a.progress >= 100) - (+b.progress >= 100) || (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  return head('Metas', `${S.goals.filter(g => +g.progress >= 100).length} de ${S.goals.length} concluídas`, `<button class="btn primary" data-act="goal-add">Nova meta</button>`) +
  (list.length ? `<div class="grid g2">${list.map(g => { const p = +g.progress || 0; return `<div class="card gcard" style="${p >= 100 ? 'opacity:.55' : ''}">
    <div class="top"><div><h3>${esc(g.title)}</h3><div class="meta"><span class="tag">${esc(g.area)}</span>${g.deadline ? `<span class="tag dash">até ${fmtD(g.deadline)}</span>` : ''}${p >= 100 ? '<span class="tag solid">Concluída</span>' : ''}</div></div>${`<div style="display:flex">${rowBtns('goal', g.id)}</div>`}</div>
    ${g.notes ? `<p class="muted" style="font-size:13px">${esc(g.notes)}</p>` : ''}
    ${bar(p, false, true)}
    <div class="foot"><span class="big">${p}%</span><div style="display:flex;gap:6px"><button class="btn sm" data-act="goal-step" data-id="${g.id}" data-step="-10">−10</button><button class="btn sm" data-act="goal-step" data-id="${g.id}" data-step="10">+10</button></div></div>
  </div>`; }).join('')}</div>` : `<div class="card">${empty('Defina metas com prazo e acompanhe o progresso.')}</div>`);
};

V.notes = () => {
  const list = [...S.notes].sort((a, b) => (!!b.pinned - !!a.pinned) || (b.updated || '').localeCompare(a.updated || ''));
  return head('Notas', 'Ideias, referências e lembretes rápidos.') + `
  <form class="card" data-form="note" style="margin-bottom:16px;display:flex;flex-direction:column;gap:10px">
    <textarea name="text" rows="3" placeholder="Escreva algo… (Ctrl + Enter para salvar)" style="border:0;padding:0;background:transparent"></textarea>
    <div style="display:flex;justify-content:flex-end"><button class="btn primary sm">Salvar nota</button></div>
  </form>
  ${list.length ? `<div class="notes">${list.map(n => `<article class="note ${n.pinned ? 'pinned' : ''}" data-act="note-edit" data-id="${n.id}">
    <p>${esc(n.text)}</p>
    <footer><span>${fmtD(n.updated?.slice(0,10))}</span><span><button class="ib" data-act="note-pin" data-id="${n.id}" aria-label="Fixar">${n.pinned ? I.pinOn : I.pin}</button><button class="ib" data-act="note-del" data-id="${n.id}" aria-label="Excluir">${I.x}</button></span></footer>
  </article>`).join('')}</div>` : ''}`;
};

V.clients = () => {
  const rows = S.clients.map(c => {
    const js = S.jobs.filter(j => j.clientId === c.id);
    return { c, n: js.length, paid: sum(js.filter(j => j.paid), j => j.value), pend: sum(js.filter(j => !j.paid), j => j.value) };
  }).sort((a, b) => b.paid + b.pend - (a.paid + a.pend));
  return head('Clientes', `${S.clients.length} cadastrado${S.clients.length === 1 ? '' : 's'}`, `<button class="btn primary" data-act="client-add">Novo cliente</button>`) + `
  <div class="card">${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Contato</th><th class="num">Jobs</th><th class="num">Recebido</th><th class="num">Pendente</th><th></th></tr></thead><tbody>
    ${rows.map(({ c, n, paid, pend }) => `<tr><td class="full"><b style="font-weight:500">${esc(c.name)}</b>${c.notes ? `<div class="faint" style="font-size:12px">${esc(c.notes)}</div>` : ''}</td><td class="muted full" ${c.contact ? 'data-l="Contato"' : ''} style="word-break:break-word">${esc(c.contact)}</td><td class="num" data-l="Jobs">${n}</td><td class="num" data-l="Recebido">${brl(paid)}</td><td class="num ${pend ? '' : 'faint'}" data-l="Pendente">${brl(pend)}</td><td class="acts" style="text-align:right;white-space:nowrap"><button class="btn sm" data-act="job-add" data-client="${c.id}">+ Job</button>${rowBtns('client', c.id)}</td></tr>`).join('')}
  </tbody></table></div>` : empty('Cadastre seus clientes para vincular aos trabalhos.')}</div>`;
};

V.jobs = () => {
  const m = today().slice(0,7), f = UI.jobFilter;
  const pend = S.jobs.filter(j => !j.paid);
  const paidMonth = S.jobs.filter(j => j.paid && (j.paidDate || '').startsWith(m));
  let list = f === 'pendentes' ? pend : f === 'pagos' ? S.jobs.filter(j => j.paid) : S.jobs;
  list = [...list].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return head('Trabalhos', 'Jobs de edição e pagamentos. Ao marcar como pago, a entrada vai para Lançamentos.', `${tabs('job-filter', f, [['pendentes','Pendentes'],['pagos','Pagos'],['todos','Todos']])}<button class="btn primary" data-act="job-add">Novo job</button>`) + `
  <div class="stats s3">
    <div class="stat inv"><span>A receber</span><b>${brl(sum(pend, j => j.value))}</b></div>
    <div class="stat"><span>Recebido em ${parse(m+'-01').toLocaleDateString('pt-BR',{month:'long'})}</span><b>${brl(sum(paidMonth, j => j.value))}</b></div>
    <div class="stat"><span>Jobs pendentes</span><b>${pend.length}</b></div>
  </div>
  <div class="card"><div class="list">${list.map(jobRow).join('') || empty(f === 'pendentes' ? 'Nenhum pagamento pendente.' : 'Nenhum job cadastrado.')}</div></div>`;
};

V.tx = () => {
  const m = UI.month, list = txOfMonth(m).sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));
  const { inc, out, bal } = monthTotals(m);
  const byCat = {};
  list.filter(t => t.type === 'out').forEach(t => { const k = t.category || 'Outros'; byCat[k] = (byCat[k] || 0) + +t.amount; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats[0]?.[1] || 1;
  let lastDate = '', rows = '';
  for (const t of list) {
    if (t.date !== lastDate) { lastDate = t.date; rows += `<div class="date-h">${cap(parse(t.date).toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' }).replace(/\./g, ''))}</div>`; }
    rows += txRow(t);
  }
  const defDate = m === today().slice(0,7) ? today() : m + '-01';
  return head('Lançamentos', 'Entradas e saídas do mês.', monthNav()) + `
  <div class="stats s3">
    <div class="stat inv"><span>Saldo</span><b>${brl(bal)}</b></div>
    <div class="stat"><span>Entradas</span><b>${brl(inc)}</b></div>
    <div class="stat"><span>Saídas</span><b>${brl(out)}</b></div>
  </div>
  <form class="inline" data-form="tx">
    <select name="type" aria-label="Tipo" style="flex:0 1 120px"><option value="out">Saída</option><option value="in">Entrada</option></select>
    <input name="desc" class="grow" placeholder="Descrição" autocomplete="off">
    <input name="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Valor" required>
    <input name="category" list="cats" placeholder="Categoria">
    <input name="date" type="date" value="${defDate}" aria-label="Data">
    <button class="btn primary">Lançar</button>
  </form>
  <div class="grid tx-grid">
    <section class="card"><div class="list">${rows || empty('Nenhum lançamento neste mês.')}</div></section>
    <section class="card"><h2>Saídas por categoria</h2>${cats.map(([c, v]) => `<div class="cat-row"><span class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c)}</span>${bar(v / max * 100)}<span class="amt" style="font-size:12px">${brl(v)}</span></div>`).join('') || empty('Sem saídas.')}</section>
  </div>`;
};

V.budget = () => {
  const m = UI.month, outs = txOfMonth(m).filter(t => t.type === 'out');
  const spent = cat => sum(outs.filter(t => norm(t.category) === norm(cat)), t => t.amount);
  const entries = Object.entries(S.budgets).map(([c, lim]) => ({ c, lim: +lim, s: spent(c) })).sort((a, b) => b.s / b.lim - a.s / a.lim);
  const totalLim = sum(entries, e => e.lim), totalSpent = sum(entries, e => e.s);
  const keys = Object.keys(S.budgets).map(norm);
  const unbudgeted = {};
  outs.filter(t => !keys.includes(norm(t.category))).forEach(t => { const k = t.category || 'Outros'; unbudgeted[k] = (unbudgeted[k] || 0) + +t.amount; });
  return head('Orçamento', 'Limite mensal por categoria, comparado com as saídas lançadas.', `${monthNav()}<button class="btn primary" data-act="budget-add">Novo limite</button>`) + `
  <div class="stats s3">
    <div class="stat inv"><span>Orçado</span><b>${brl(totalLim)}</b></div>
    <div class="stat"><span>Gasto nas categorias</span><b>${brl(totalSpent)}</b></div>
    <div class="stat"><span>${totalLim - totalSpent < 0 ? 'Acima do orçamento' : 'Disponível'}</span><b>${brl(Math.abs(totalLim - totalSpent))}</b></div>
  </div>
  <div class="card"><div class="list">${entries.map(e => { const p = e.lim ? e.s / e.lim * 100 : 0, over = e.s > e.lim; return `<div class="row" style="flex-wrap:wrap">
      <div class="main" style="min-width:140px" data-act="budget-edit" data-id="${esc(e.c)}"><div class="t">${esc(e.c)}${over ? ' <span class="tag solid" style="margin-left:6px">Estourou</span>' : ''}</div><div class="sub mono">${brl(e.s)} de ${brl(e.lim)}</div></div>
      <div style="flex:2 1 200px">${bar(p, over)}</div>
      <span class="mono" style="width:48px;text-align:right;font-size:12px">${Math.round(p)}%</span>
      <div class="end"><button class="ib" data-act="budget-edit" data-id="${esc(e.c)}" aria-label="Editar">${I.edit}</button><button class="ib" data-act="budget-del" data-id="${esc(e.c)}" aria-label="Excluir">${I.x}</button></div></div>`; }).join('') || empty('Defina limites, como Mercado R$ 800 ou Lazer R$ 300.')}</div></div>
  ${Object.keys(unbudgeted).length ? `<section class="card" style="margin-top:16px"><h2>Gastos sem limite definido</h2><div class="list">${Object.entries(unbudgeted).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="row"><div class="main t">${esc(c)}</div><span class="amt">${brl(v)}</span><button class="btn sm" data-act="budget-add" data-cat="${esc(c)}">Definir limite</button></div>`).join('')}</div></section>` : ''}`;
};

V.bills = () => {
  const m = UI.month;
  const list = [...S.bills].sort((a, b) => a.dueDay - b.dueDay);
  const total = sum(list, b => b.amount), paid = sum(list.filter(b => b.paid?.[m]), b => b.amount);
  return head('Contas fixas', 'Contas recorrentes. Ao pagar, a saída vai para Lançamentos.', `${monthNav()}<button class="btn primary" data-act="bill-add">Nova conta</button>`) + `
  <div class="stats s3">
    <div class="stat inv"><span>Total mensal</span><b>${brl(total)}</b></div>
    <div class="stat"><span>Pago em ${parse(m+'-01').toLocaleDateString('pt-BR',{month:'long'})}</span><b>${brl(paid)}</b></div>
    <div class="stat"><span>Falta pagar</span><b>${brl(total - paid)}</b></div>
  </div>
  <div class="card"><div class="list">${list.map(b => billRow(b, m)).join('') || empty('Cadastre aluguel, internet, assinaturas, plano de saúde…')}</div></div>`;
};

V.boxes = () => {
  const total = sum(S.boxes, b => b.saved);
  return head('Caixinhas', `Total guardado: <span class="mono" style="color:var(--text)">${brl(total)}</span>`, `<button class="btn primary" data-act="box-add">Nova caixinha</button>`) +
  (S.boxes.length ? `<div class="grid g3">${S.boxes.map(b => { const p = b.target ? b.saved / b.target * 100 : 0; return `<div class="card gcard">
    <div class="top"><div><h3>${esc(b.name)}</h3><div class="meta">${b.deadline ? `<span class="tag dash">até ${fmtD(b.deadline)}</span>` : ''}${p >= 100 ? '<span class="tag solid">Meta atingida</span>' : ''}</div></div><div style="display:flex">${rowBtns('box', b.id)}</div></div>
    <div><div class="big">${brl(b.saved)}</div><div class="muted mono" style="font-size:12px;margin-top:6px">de ${brl(b.target)} · ${Math.round(p)}%</div></div>
    ${bar(p, false, true)}
    <div style="display:flex;gap:6px"><button class="btn sm primary" data-act="box-move" data-id="${b.id}" data-dir="1">Guardar</button><button class="btn sm" data-act="box-move" data-id="${b.id}" data-dir="-1">Retirar</button></div>
  </div>`; }).join('')}</div>` : `<div class="card">${empty('Crie reservas como “Reserva de emergência” ou “Câmera nova”.')}</div>`);
};

V.settings = () => head('Ajustes', 'Seus dados ficam salvos apenas neste navegador.') + `
  <div class="settings">
    <form class="card" data-form="settings"><h2>Seu nome</h2><div class="inline" style="margin:0"><input name="name" value="${esc(S.name)}" placeholder="Como quer ser chamado?" class="grow"><button class="btn primary">Salvar</button></div></form>
    <div class="card"><h2>Backup</h2><p>Exporte um arquivo .json com tudo para guardar ou levar para outro computador. Recomendado fazer de vez em quando: limpar os dados do navegador apaga o painel.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="export">Exportar backup</button><button class="btn" data-act="import">Importar backup</button></div></div>
    <div class="card"><h2>Zona de perigo</h2><p>Apaga permanentemente todos os dados do painel neste navegador.</p><button class="btn danger" data-act="reset">Apagar tudo</button></div>
  </div>`;

/* ---------- navegação e render ---------- */
const NAV = [
  ['', [['overview','Visão geral']]],
  ['Pessoal', [['tasks','Tarefas'],['habits','Hábitos'],['goals','Metas'],['notes','Notas']]],
  ['Trabalho', [['jobs','Trabalhos'],['clients','Clientes']]],
  ['Finanças', [['tx','Lançamentos'],['budget','Orçamento'],['bills','Contas fixas'],['boxes','Caixinhas']]],
  ['', [['settings','Ajustes']]],
];
const route = () => { const r = location.hash.slice(1); return V[r] ? r : 'overview'; };
function render() {
  const r = route();
  $('#nav').innerHTML = NAV.map(([g, items]) => `<div class="nav-group">${g ? `<div class="nav-label">${g}</div>` : ''}${items.map(([k, l]) => `<a href="#${k}" class="${k === r ? 'on' : ''}">${l}</a>`).join('')}</div>`).join('');
  $('#main').innerHTML = V[r]();
  $('#menuLabel').textContent = NAV.flatMap(([, items]) => items).find(([k]) => k === r)[1];
  syncCats();
}
const setMenu = open => { document.body.classList.toggle('menu-open', open); $('#menuBtn').setAttribute('aria-expanded', open); };
$('#menuBtn').onclick = () => setMenu(!document.body.classList.contains('menu-open'));
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
window.addEventListener('hashchange', () => { setMenu(false); render(); scrollTo(0, 0); });

/* ---------- ações ---------- */
const find = (arr, id) => S[arr].find(x => x.id === id);
const del = (arr, id) => { S[arr] = S[arr].filter(x => x.id !== id); };

const taskFields = [
  { name:'title', label:'Tarefa', required:true },
  { name:'due', label:'Data', type:'date' },
  { name:'prio', label:'Prioridade', type:'select', options:[['alta','Alta'],['media','Média'],['baixa','Baixa']], value:'media' },
];
const jobFields = () => [
  { name:'title', label:'Projeto', required:true, placeholder:'Ex.: Reels de lançamento' },
  { name:'clientId', label:'Cliente', type:'select', options:[['', '— sem cliente —'], ...S.clients.map(c => [c.id, c.name])] },
  { name:'value', label:'Valor (R$)', type:'number', step:'0.01', min:0, required:true },
  { name:'date', label:'Data de entrega', type:'date', value:today() },
];
const txFields = [
  { name:'type', label:'Tipo', type:'select', options:[['out','Saída'],['in','Entrada']] },
  { name:'desc', label:'Descrição' },
  { name:'amount', label:'Valor (R$)', type:'number', step:'0.01', min:0, required:true },
  { name:'category', label:'Categoria', list:'cats' },
  { name:'date', label:'Data', type:'date', required:true },
];
const billFields = [
  { name:'name', label:'Conta', required:true, placeholder:'Ex.: Aluguel' },
  { name:'amount', label:'Valor (R$)', type:'number', step:'0.01', min:0, required:true },
  { name:'dueDay', label:'Dia do vencimento', type:'number', min:1, max:31, value:10, required:true },
  { name:'category', label:'Categoria', list:'cats', value:'Moradia' },
];
const boxFields = [
  { name:'name', label:'Nome', required:true, placeholder:'Ex.: Reserva de emergência' },
  { name:'target', label:'Meta (R$)', type:'number', step:'0.01', min:0, required:true },
  { name:'saved', label:'Já guardado (R$)', type:'number', step:'0.01', min:0, value:0 },
  { name:'deadline', label:'Prazo (opcional)', type:'date' },
];
const goalFields = [
  { name:'title', label:'Meta', required:true },
  { name:'area', label:'Área', type:'select', options:GOAL_AREAS },
  { name:'deadline', label:'Prazo', type:'date' },
  { name:'progress', label:'Progresso (%)', type:'number', min:0, max:100, value:0 },
  { name:'notes', label:'Observações', type:'textarea', rows:3 },
];
const clientFields = [
  { name:'name', label:'Nome', required:true },
  { name:'contact', label:'Contato', placeholder:'WhatsApp, e-mail, @' },
  { name:'notes', label:'Observações', type:'textarea', rows:3 },
];
const clampPct = v => Math.max(0, Math.min(100, Math.round(+v || 0)));

function syncJobTx(j) {
  const t = S.tx.find(x => x.jobId === j.id);
  if (t) { t.amount = +j.value; t.desc = j.title + (clientName(j.clientId) ? ' · ' + clientName(j.clientId) : ''); }
}
function unlinkTx(t) {
  if (t.jobId) { const j = find('jobs', t.jobId); if (j) { j.paid = false; j.paidDate = ''; } }
  if (t.billId) { const b = find('bills', t.billId); if (b?.paid) for (const k in b.paid) if (b.paid[k] === t.id) delete b.paid[k]; }
}

const A = {
  month: el => { UI.month = shiftMonth(UI.month, +el.dataset.step); render(); },
  'task-filter': el => { UI.taskFilter = el.dataset.v; render(); },
  'job-filter': el => { UI.jobFilter = el.dataset.v; render(); },

  'task-toggle': el => { const x = find('tasks', el.dataset.id); x.done = !x.done; x.doneAt = x.done ? new Date().toISOString() : ''; save(); },
  'task-edit': el => { const x = find('tasks', el.dataset.id); openForm({ title:'Editar tarefa', fields:taskFields, values:x, onSave: d => Object.assign(x, d), onDelete: () => del('tasks', x.id) }); },
  'task-del': el => { del('tasks', el.dataset.id); save('Tarefa removida'); },
  'task-clear': () => { if (confirm('Remover todas as tarefas concluídas?')) { S.tasks = S.tasks.filter(x => !x.done); save(); } },

  'habit-add': () => openForm({ title:'Novo hábito', fields:[{ name:'name', label:'Hábito', required:true, placeholder:'Ex.: Treinar' }], onSave: d => { S.habits.push({ id:uid(), name:d.name, log:{} }); } }),
  'habit-edit': el => { const h = find('habits', el.dataset.id); openForm({ title:'Editar hábito', fields:[{ name:'name', label:'Hábito', required:true }], values:h, onSave: d => { h.name = d.name; }, onDelete: () => confirm(`Excluir “${h.name}” e todo o histórico?`) ? del('habits', h.id) : false }); },
  'habit-toggle': el => { const h = find('habits', el.dataset.id), d = el.dataset.day; if (h.log[d]) delete h.log[d]; else h.log[d] = true; save(); },

  'goal-add': () => openForm({ title:'Nova meta', fields:goalFields, onSave: d => { S.goals.push({ id:uid(), ...d, progress:clampPct(d.progress) }); } }),
  'goal-edit': el => { const g = find('goals', el.dataset.id); openForm({ title:'Editar meta', fields:goalFields, values:g, onSave: d => Object.assign(g, d, { progress:clampPct(d.progress) }), onDelete: () => del('goals', g.id) }); },
  'goal-del': el => { if (confirm('Excluir esta meta?')) { del('goals', el.dataset.id); save(); } },
  'goal-step': el => { const g = find('goals', el.dataset.id); g.progress = clampPct((+g.progress || 0) + +el.dataset.step); save(); },

  'note-edit': (el, e) => { if (e.target.closest('.ib')) return; const n = find('notes', el.dataset.id); openForm({ title:'Nota', fields:[{ name:'text', label:'Texto', type:'textarea', rows:10, required:true }], values:n, onSave: d => { n.text = d.text; n.updated = new Date().toISOString(); }, onDelete: () => del('notes', n.id) }); },
  'note-pin': el => { const n = find('notes', el.dataset.id); n.pinned = !n.pinned; save(); },
  'note-del': el => { if (confirm('Excluir esta nota?')) { del('notes', el.dataset.id); save(); } },

  'client-add': () => openForm({ title:'Novo cliente', fields:clientFields, onSave: d => { S.clients.push({ id:uid(), ...d }); } }),
  'client-edit': el => { const c = find('clients', el.dataset.id); openForm({ title:'Editar cliente', fields:clientFields, values:c, onSave: d => { Object.assign(c, d); S.jobs.filter(j => j.clientId === c.id).forEach(syncJobTx); }, onDelete: () => confirm('Excluir cliente? Os jobs dele continuam salvos, sem cliente.') ? del('clients', c.id) : false }); },
  'client-del': el => { const c = find('clients', el.dataset.id); if (confirm(`Excluir “${c.name}”? Os jobs dele continuam salvos, sem cliente.`)) { del('clients', c.id); save(); } },

  'job-add': el => openForm({ title:'Novo job', fields:jobFields(), values:{ clientId: el.dataset.client || '' }, onSave: d => { S.jobs.push({ id:uid(), ...d, paid:false, paidDate:'' }); } }),
  'job-edit': el => { const j = find('jobs', el.dataset.id); openForm({ title:'Editar job', fields:jobFields(), values:j, onSave: d => { Object.assign(j, d); syncJobTx(j); }, onDelete: () => A._jobDel(j) }); },
  'job-del': el => { if (A._jobDel(find('jobs', el.dataset.id)) !== false) save('Job removido'); },
  _jobDel: j => { if (!confirm(`Excluir “${j.title}”?${j.paid ? ' A entrada ligada a ele em Lançamentos também será removida.' : ''}`)) return false; S.tx = S.tx.filter(t => t.jobId !== j.id); del('jobs', j.id); },
  'job-paid': el => {
    const j = find('jobs', el.dataset.id);
    if (j.paid) { S.tx = S.tx.filter(t => t.jobId !== j.id); j.paid = false; j.paidDate = ''; save('Marcado como pendente'); }
    else {
      j.paid = true; j.paidDate = today();
      S.tx.push({ id:uid(), type:'in', desc:'', amount:+j.value, category:'Edição de vídeo', date:today(), jobId:j.id, created:new Date().toISOString() });
      syncJobTx(j); save('Pago · entrada lançada');
    }
  },

  'tx-edit': el => { const t = find('tx', el.dataset.id); openForm({ title:'Editar lançamento', fields:txFields, values:t, onSave: d => { if (!(d.amount > 0)) { toast('Informe um valor'); return false; } Object.assign(t, d); if (t.jobId) { const j = find('jobs', t.jobId); if (j) { j.value = t.amount; j.paidDate = t.date; } } }, onDelete: () => { unlinkTx(t); del('tx', t.id); } }); },
  'tx-del': el => { const t = find('tx', el.dataset.id); if (!confirm('Excluir este lançamento?' + (t.jobId ? ' O job volta a ficar pendente.' : t.billId ? ' A conta volta a ficar em aberto.' : ''))) return; unlinkTx(t); del('tx', t.id); save(); },

  'budget-add': el => openForm({ title:'Limite por categoria', fields:[{ name:'cat', label:'Categoria', list:'cats', required:true }, { name:'lim', label:'Limite mensal (R$)', type:'number', step:'0.01', min:0, required:true }], values:{ cat: el.dataset.cat || '' }, onSave: d => { S.budgets[d.cat] = d.lim; } }),
  'budget-edit': el => { const c = el.dataset.id; openForm({ title:'Editar limite', fields:[{ name:'cat', label:'Categoria', list:'cats', required:true }, { name:'lim', label:'Limite mensal (R$)', type:'number', step:'0.01', min:0, required:true }], values:{ cat:c, lim:S.budgets[c] }, onSave: d => { delete S.budgets[c]; S.budgets[d.cat] = d.lim; }, onDelete: () => { delete S.budgets[c]; } }); },
  'budget-del': el => { delete S.budgets[el.dataset.id]; save('Limite removido'); },

  'bill-add': () => openForm({ title:'Nova conta fixa', fields:billFields, onSave: d => { S.bills.push({ id:uid(), ...d, dueDay:Math.max(1, Math.min(31, Math.round(d.dueDay) || 1)), paid:{} }); } }),
  'bill-edit': el => { const b = find('bills', el.dataset.id); openForm({ title:'Editar conta', fields:billFields, values:b, onSave: d => { Object.assign(b, d, { dueDay:Math.max(1, Math.min(31, Math.round(d.dueDay) || 1)) }); }, onDelete: () => confirm('Excluir esta conta? Pagamentos já lançados continuam em Lançamentos.') ? del('bills', b.id) : false }); },
  'bill-del': el => { if (confirm('Excluir esta conta? Pagamentos já lançados continuam em Lançamentos.')) { del('bills', el.dataset.id); save(); } },
  'bill-paid': el => {
    const b = find('bills', el.dataset.id), m = el.dataset.m; b.paid = b.paid || {};
    if (b.paid[m]) { S.tx = S.tx.filter(t => t.id !== b.paid[m]); delete b.paid[m]; save('Conta reaberta'); return; }
    const date = m === today().slice(0,7) ? today() : `${m}-${pad(Math.min(b.dueDay, daysInMonth(m)))}`;
    const t = { id:uid(), type:'out', desc:b.name, amount:+b.amount, category:b.category || 'Contas fixas', date, billId:b.id, created:new Date().toISOString() };
    S.tx.push(t); b.paid[m] = t.id; save('Pago · saída lançada');
  },

  'box-add': () => openForm({ title:'Nova caixinha', fields:boxFields, onSave: d => { S.boxes.push({ id:uid(), ...d }); } }),
  'box-edit': el => { const b = find('boxes', el.dataset.id); openForm({ title:'Editar caixinha', fields:boxFields, values:b, onSave: d => Object.assign(b, d), onDelete: () => del('boxes', b.id) }); },
  'box-del': el => { if (confirm('Excluir esta caixinha?')) { del('boxes', el.dataset.id); save(); } },
  'box-move': el => { const b = find('boxes', el.dataset.id), dir = +el.dataset.dir; openForm({ title: dir > 0 ? `Guardar em “${b.name}”` : `Retirar de “${b.name}”`, fields:[{ name:'v', label:'Valor (R$)', type:'number', step:'0.01', min:0, required:true }], saveLabel: dir > 0 ? 'Guardar' : 'Retirar', onSave: d => { if (!(d.v > 0)) { toast('Informe um valor'); return false; } b.saved = Math.max(0, (+b.saved || 0) + dir * d.v); } }); },

  export: () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `painel-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup exportado');
  },
  import: () => $('#importFile').click(),
  reset: () => { if (confirm('Apagar TODOS os dados do painel? Isso não pode ser desfeito.') && confirm('Tem certeza? Exporte um backup antes se quiser guardar algo.')) { S = defaults(); save('Dados apagados'); } },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  if (el.type === 'checkbox') e.preventDefault();
  A[el.dataset.act](el, e);
});

const F = {
  task: d => { if (!d.title) return; S.tasks.push({ id:uid(), title:d.title, due:d.due || '', prio:d.prio || 'media', done:false, created:new Date().toISOString() }); return 'Tarefa adicionada'; },
  'task-quick': d => { if (!d.title) return; S.tasks.push({ id:uid(), title:d.title, due:today(), prio:'media', done:false, created:new Date().toISOString() }); return 'Tarefa adicionada'; },
  note: d => { if (!d.text) return; const now = new Date().toISOString(); S.notes.push({ id:uid(), text:d.text, pinned:false, created:now, updated:now }); return 'Nota salva'; },
  tx: d => { const amount = parseFloat(String(d.amount).replace(',', '.')); if (!(amount > 0)) { toast('Informe um valor'); return; } S.tx.push({ id:uid(), type:d.type, desc:d.desc, amount, category:d.category || 'Outros', date:d.date || today(), created:new Date().toISOString() }); return 'Lançado'; },
  settings: d => { S.name = d.name; return 'Salvo'; },
};
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const d = Object.fromEntries([...new FormData(form)].map(([k, v]) => [k, String(v).trim()]));
  const msg = F[form.dataset.form](d);
  if (msg) {
    save(msg);
    const again = document.querySelector(`[data-form="${form.dataset.form}"] input[name="title"], [data-form="${form.dataset.form}"] textarea, [data-form="${form.dataset.form}"] input[name="desc"]`);
    if (again && form.dataset.form !== 'settings') again.focus();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('[data-form="note"] textarea')) e.target.form.requestSubmit();
});

$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (typeof data !== 'object' || !Array.isArray(data.tasks)) throw 0;
      if (confirm('Substituir os dados atuais pelo backup?')) { S = Object.assign(defaults(), data); save('Backup importado'); }
    } catch (err) { toast('Arquivo inválido'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

render();
</script>
</body>
</html>
